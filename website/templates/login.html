{% extends "base.html" %}
{% block title %}Login - System Identification{% endblock %}

{% block content %}
<div class="container" style="max-width: 500px; margin-top: 80px;">
    <div class="login-card" style="background: white; padding: 40px; border-radius: 15px; box-shadow: 0 10px 40px rgba(0,0,0,0.1);">
        <div class="text-center mb-4">
            <div style="width: 80px; height: 80px; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); border-radius: 50%; margin: 0 auto 20px; display: flex; align-items: center; justify-content: center; font-size: 2.5rem; color: white;">
                🔐
            </div>
            <h2 style="color: #333; font-weight: bold; margin-bottom: 10px;">Bine ai revenit!</h2>
            <p style="color: #666; font-size: 1rem;">Conectează-te pentru a accesa platforma</p>
        </div>

        <form method="POST">
            <div class="form-group mb-3">
                <label for="email" style="color: #333; font-weight: 500; margin-bottom: 8px;">Email Address</label>
                <input
                    type="email"
                    class="form-control"
                    id="email"
                    name="email"
                    placeholder="nume@exemplu.com"
                    style="padding: 12px 15px; border: 2px solid #e0e0e0; border-radius: 8px; font-size: 1rem;"
                    required
                />
            </div>

            <div class="form-group mb-4">
                <label for="password" style="color: #333; font-weight: 500; margin-bottom: 8px;">Password</label>
                <input
                    type="password"
                    class="form-control"
                    id="password"
                    name="password"
                    placeholder="Introdu parola"
                    style="padding: 12px 15px; border: 2px solid #e0e0e0; border-radius: 8px; font-size: 1rem;"
                    required
                />
            </div>

            <button
                type="submit"
                class="btn btn-primary w-100"
                style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); border: none; padding: 12px; font-size: 1.1rem; font-weight: 600; border-radius: 8px; transition: transform 0.2s;"
            >
                Login
            </button>
        </form>

        <div class="text-center mt-4">
            <p style="color: #666; margin-bottom: 10px;">Nu ai cont?</p>
            <a href="/signUp" style="color: #667eea; font-weight: 600; text-decoration: none; font-size: 1.05rem;">
                Creează cont nou →
            </a>
        </div>
    </div>

    <div class="text-center mt-4">
        <a href="/" style="color: #666; text-decoration: none; font-size: 0.95rem;">
            ← Înapoi la pagina principală
        </a>
    </div>
</div>

<style>
    .form-control:focus {
        border-color: #667eea !important;
        box-shadow: 0 0 0 0.2rem rgba(102, 126, 234, 0.25) !important;
    }

    .btn-primary:hover {
        transform: translateY(-2px);
        box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
    }

    .login-card {
        animation: slideUp 0.5s ease-out;
    }

    @keyframes slideUp {
        from {
            opacity: 0;
            transform: translateY(30px);
        }
        to {
            opacity: 1;
            transform: translateY(0);
        }
    }

    @media (max-width: 576px) {
        .login-card {
            padding: 30px 20px;
        }
    }
</style>
{% endblock %}
